<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Bank Quiz</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#0f172a;font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
.ui{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div id="toasts" class="ui fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-50 space-y-2"></div>

<main class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-semibold mb-6 text-center">Test bank quiz</h1>

  <!-- Upload -->
  <section id="upload" class="bg-slate-800 rounded-xl p-8 text-center ui border border-slate-700">
    <label for="file" id="drop" class="block cursor-pointer border-2 border-dashed border-slate-600 hover:border-indigo-400 rounded-lg p-10">
      <p class="text-lg">Drop a test bank PDF here, or click to choose one</p>
      <p class="text-sm text-slate-400 mt-2">Everything is parsed in your browser. Nothing is uploaded.</p>
    </label>
    <input id="file" type="file" accept="application/pdf" class="hidden">
    <p id="status" class="text-sm text-slate-400 mt-4 h-5"></p>
  </section>

  <!-- Quiz -->
  <section id="quiz" class="hidden ui">
    <div class="flex items-center justify-between text-sm text-slate-400 mb-2">
      <span id="progress">Question 1 of 1</span>
      <span>Score <span id="score" class="text-slate-100 font-medium">0</span> · <span id="timer" class="tabular-nums text-slate-100">00:00</span></span>
    </div>
    <div class="h-1.5 bg-slate-800 rounded-full mb-5 overflow-hidden"><div id="bar" class="h-full bg-indigo-400 transition-all" style="width:0%"></div></div>
    <div class="bg-slate-800 rounded-xl p-6 sm:p-8 border border-slate-700">
      <p id="stem" class="text-lg leading-relaxed mb-6" style="font-family:Georgia,serif"></p>
      <div id="options" class="space-y-3"></div>
      <div class="flex gap-3 mt-8">
        <button id="show" class="px-4 py-2 rounded-lg bg-indigo-500 hover:bg-indigo-400 font-medium">Show answer</button>
        <button id="next" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 font-medium ml-auto">Next question</button>
      </div>
    </div>
  </section>

  <!-- Results -->
  <section id="results" class="hidden ui bg-slate-800 rounded-xl p-8 text-center border border-slate-700">
    <h2 class="text-xl font-semibold">Quiz complete</h2>
    <p id="final" class="text-slate-300 mt-3"></p>
    <button id="again" class="mt-6 px-4 py-2 rounded-lg bg-indigo-500 hover:bg-indigo-400 font-medium">Load another PDF</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let questions = [], cur = 0, score = 0, t0 = 0, tick = null;

/* ---------- Toasts ---------- */
function toast(msg, type = 'error') {
  const el = document.createElement('div');
  el.className = 'rounded-lg px-4 py-3 text-sm shadow-lg border ' + (type === 'error' ? 'bg-red-950 border-red-700 text-red-100' : 'bg-amber-950 border-amber-700 text-amber-100');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400); }, 4500);
}

/* ---------- PDF text extraction ---------- */
async function extractText(buf) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const items = (await (await pdf.getPage(p)).getTextContent()).items;
    let lastY = null, lastEnd = null;
    for (const it of items) {
      if (!it.str && !it.hasEOL) continue;
      const x = it.transform[4], y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { out += '\n'; lastEnd = null; }
      else if (lastEnd !== null && x - lastEnd > 1 && !/\s$/.test(out) && !/^\s/.test(it.str)) out += ' ';
      out += it.str;
      if (it.hasEOL) { out += '\n'; lastEnd = null; } else lastEnd = x + (it.width || 0);
      lastY = y;
    }
    out += '\n';
  }
  return out;
}

/* ---------- Regex parsing ---------- */
const norm = s => s.replace(/\s+/g, ' ').trim();

function cleanLines(text) {
  return text.split('\n')
    .map(l => l.replace(/\.(\d{1,3}-\d{1,3})\s*$/, '.'))
    .filter(l => !/^\s*Copyright ©/i.test(l) && !/^\s*\d{1,3}-\d{1,3}\s*$/.test(l))
    .map(l => l.trim()).filter(Boolean);
}

// Split lines into blocks that start at sequential "N. text" lines.
function toBlocks(lines, stopAtAACSB) {
  const blocks = []; let expected = 1, cur = null;
  for (const l of lines) {
    const m = l.match(/^(\d{1,3})\.\s+\S/);
    if (m && +m[1] === expected) { cur = { num: expected++, lines: [l], done: false }; blocks.push(cur); continue; }
    if (!cur || cur.done) continue;
    if (stopAtAACSB && /^AACSB:/.test(l)) { cur.done = true; continue; }
    cur.lines.push(l);
  }
  return blocks;
}

function parseQuestion(block) {
  let stem = '', opts = [], target = 'stem', next = 'A';
  block.lines.forEach((l, i) => {
    if (i === 0) l = l.replace(/^\d+\.\s*/, '');
    const m = l.match(/^([A-E])\.\s+(.*)$/);
    if (m && m[1] === next) { opts.push({ letter: m[1], text: m[2] }); next = String.fromCharCode(next.charCodeAt(0) + 1); target = 'opt'; }
    else if (target === 'stem') stem += ' ' + l;
    else opts[opts.length - 1].text += ' ' + l;
  });
  return { num: block.num, stem: norm(stem), options: opts.map(o => ({ letter: o.letter, text: norm(o.text) })), answerText: null };
}

function extractAnswer(block, q) {
  let t = norm(block.lines.join(' ').replace(/^\d+\.\s*/, ''));
  const rm = s => {
    s = norm(s); if (!s) return;
    const i = t.toLowerCase().indexOf(s.toLowerCase());
    if (i >= 0) t = norm(t.slice(0, i) + ' ' + t.slice(i + s.length));
  };
  rm(q.stem);
  q.options.forEach(o => { const before = t; rm(o.letter + '. ' + o.text); if (t === before) rm(o.text); });
  return t || null;
}

function parseBank(text) {
  const keyRe = /Test Bank\s*[-–—]\s*Static\s*Key/gi;
  let keyIdx = -1, m;
  while ((m = keyRe.exec(text))) keyIdx = m.index;
  const qText = keyIdx >= 0 ? text.slice(0, keyIdx) : text;
  let kText = keyIdx >= 0 ? text.slice(keyIdx) : '';
  const sum = kText.search(/Test Bank\s*[-–—]\s*Static\s*Summary/i);
  if (sum >= 0) kText = kText.slice(0, sum);

  const qs = toBlocks(cleanLines(qText), false).map(parseQuestion).filter(q => q.options.length >= 2);
  const kBlocks = toBlocks(cleanLines(kText), true);
  qs.forEach(q => {
    const kb = kBlocks.find(b => b.num === q.num);
    if (kb) q.answerText = extractAnswer(kb, q);
  });
  if (!kText) toast('No “Static Key” section found. Answers will be unavailable.', 'warn');
  return qs;
}

/* ---------- Answer matching (text of key vs. rendered options) ---------- */
const STOP = new Set(['the', 'a', 'an', 'of', 'to', 'is', 'are', 'and', 'or', 'in', 'as', 'be', 'by', 'that', 'for']);
const stm = w => (w.length > 4 && /[a-z]$/.test(w)) ? w.replace(/(ing|ed|es|s)$/, '') : w;
const toks = s => (s.toLowerCase().match(/\d+(?:\.\d+)?|[a-z]+/g) || []).filter(w => !STOP.has(w)).map(stm);
const bigrams = t => { const m = new Map(); for (let i = 1; i < t.length; i++) { const k = t[i - 1] + ' ' + t[i]; m.set(k, (m.get(k) || 0) + 1); } return m; };
function dice(a, b) {
  const A = bigrams(a), B = bigrams(b); let hit = 0, na = 0, nb = 0;
  A.forEach((v, k) => { na += v; hit += Math.min(v, B.get(k) || 0); }); B.forEach(v => nb += v);
  return na + nb ? 2 * hit / (na + nb) : 0;
}
function filled(stem, opt) {
  const blanks = stem.match(/_{2,}/g);
  if (!blanks) return stem + ' ' + opt;
  const segs = opt.split(/\s*;\s*/);
  if (segs.length === blanks.length) { let i = 0; return stem.replace(/_{2,}/g, () => segs[i++]); }
  return blanks.length === 1 ? stem.replace(/_{2,}/, opt) : stem + ' ' + opt;
}
function bestMatch(answer, optTexts, stem) {
  const at = toks(answer), aj = ' ' + at.join(' ') + ' ';
  const isAll = t => /^all of the (options|above)/i.test(t), isNone = t => /^none of the/i.test(t);
  const meta = optTexts.map(t => isAll(t) || isNone(t));
  const contig = optTexts.map((t, i) => !meta[i] && toks(t).length > 0 && aj.includes(' ' + toks(t).join(' ') + ' '));
  if (contig.filter(Boolean).length >= 2) {
    let i = optTexts.findIndex(isAll); if (i < 0) i = optTexts.findIndex(isNone);
    if (i >= 0) return { idx: i, score: 1 };
  }
  const aset = new Set(at);
  let best = { idx: -1, score: 0 };
  optTexts.forEach((t, i) => {
    if (meta[i]) return;
    const ot = toks(t); if (!ot.length) return;
    const cont = ot.filter(w => aset.has(w)).length / ot.length;
    const s = 0.6 * cont + 0.4 * dice(toks(filled(stem, t)), at) + (contig[i] ? 0.2 : 0);
    if (s > best.score) best = { idx: i, score: s };
  });
  return best.score < 0.35 ? { idx: -1, score: best.score } : best;
}

/* ---------- Quiz UI ---------- */
const BASE = 'opt w-full text-left rounded-lg border px-4 py-3 flex gap-3 transition-colors ';
const IDLE = 'border-slate-600 bg-slate-900/40 hover:border-indigo-400';

function render() {
  const q = questions[cur];
  $('progress').textContent = `Question ${cur + 1} of ${questions.length}`;
  $('bar').style.width = (cur / questions.length * 100) + '%';
  $('stem').textContent = `${q.num}. ${q.stem}`;
  $('options').innerHTML = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = BASE + IDLE; b.dataset.i = i;
    b.innerHTML = '<span class="font-semibold text-slate-400"></span><span class="opt-text"></span>';
    b.children[0].textContent = o.letter + '.'; b.children[1].textContent = o.text;
    b.onclick = () => select(i);
    $('options').appendChild(b);
  });
  q.selected = null; q.locked = false;
  $('show').disabled = false; $('show').classList.remove('opacity-50');
  $('next').textContent = cur === questions.length - 1 ? 'Finish' : 'Next question';
}

function select(i) {
  const q = questions[cur]; if (q.locked) return;
  q.selected = i;
  [...$('options').children].forEach((b, j) => b.className = BASE + (j === i ? 'border-indigo-400 bg-indigo-500/20' : IDLE));
}

$('show').onclick = () => {
  const q = questions[cur]; if (q.locked) return;
  if (!q.answerText) { toast(`No answer key found for question ${q.num}.`); return; }
  const btns = [...$('options').children];
  const texts = btns.map(b => b.querySelector('.opt-text').textContent);
  const { idx } = bestMatch(q.answerText, texts, q.stem);
  q.locked = true; $('show').disabled = true; $('show').classList.add('opacity-50');
  btns.forEach(b => b.classList.add('cursor-default'));
  if (idx < 0) { toast(`Couldn’t find the option text for question ${q.num} in the key.`); return; }
  btns.forEach((b, j) => {
    if (j === idx) b.className = BASE + 'cursor-default border-green-500 bg-green-600/25';
    else if (j === q.selected) b.className = BASE + 'cursor-default border-red-500 bg-red-600/20';
    else b.className = BASE + 'cursor-default border-slate-700 opacity-60';
  });
  if (q.selected === idx) { score++; $('score').textContent = score; }
};

$('next').onclick = () => {
  if (cur < questions.length - 1) { cur++; render(); return; }
  clearInterval(tick); $('bar').style.width = '100%';
  $('quiz').classList.add('hidden'); $('results').classList.remove('hidden');
  $('final').textContent = `You scored ${score} of ${questions.length} in ${$('timer').textContent}.`;
};
$('again').onclick = () => { $('results').classList.add('hidden'); $('upload').classList.remove('hidden'); $('status').textContent = ''; $('file').value = ''; };

function startQuiz(qs) {
  questions = qs; cur = 0; score = 0; $('score').textContent = 0;
  $('upload').classList.add('hidden'); $('quiz').classList.remove('hidden');
  t0 = Date.now(); clearInterval(tick);
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);
  render();
  const missing = qs.filter(q => !q.answerText).map(q => q.num);
  if (missing.length) toast(`No answer key found for question${missing.length > 1 ? 's' : ''} ${missing.slice(0, 8).join(', ')}${missing.length > 8 ? '…' : ''}.`, 'warn');
}

/* ---------- File handling ---------- */
async function handleFile(f) {
  if (!f) return;
  if (typeof pdfjsLib === 'undefined') { toast('pdf.js failed to load. Check your connection and reload.'); return; }
  $('status').textContent = 'Reading PDF…';
  try {
    const text = await extractText(await f.arrayBuffer());
    const qs = parseBank(text);
    $('status').textContent = '';
    if (!qs.length) { toast('No questions found. Questions need to look like “1. Question text” with “A. Option” lines.'); return; }
    startQuiz(qs);
  } catch (e) {
    $('status').textContent = '';
    toast('Couldn’t read that PDF: ' + (e.message || e));
  }
}
$('file').onchange = e => handleFile(e.target.files[0]);
['dragover', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault(); if (ev === 'drop') handleFile(e.dataTransfer.files[0]);
}));
</script>
</body>
</html>
